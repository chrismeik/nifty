services:
  astro-databyjane:
    build:
      context: ../../../marketing/databyjane.com/_platform/_astro
      dockerfile: Dockerfile
    volumes:
      - ../../../marketing/databyjane.com/_platform/_astro:/app
      - databyjane_astro_modules:/app/node_modules
    restart: unless-stopped
    ports:
      - "4323:4323"

volumes:
  databyjane_astro_modules:
