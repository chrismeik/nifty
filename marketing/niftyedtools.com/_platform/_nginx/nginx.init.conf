upstream api {
    server api:8000;
}

# HTTP only — used for initial Let's Encrypt cert issuance
server {
    listen 80;
    server_name niftyedtools.com www.niftyedtools.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
