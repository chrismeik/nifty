upstream api {
    server api:8000;
}

upstream astro-nifty {
    server astro-nifty:4321;
}

upstream astro-veratreeos {
    server astro-veratreeos:4322;
}

server {
    listen 80;
    server_name localhost;

    location /api/ {
        proxy_pass http://api/;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    location /healthz { proxy_pass http://api; }
    location /readyz  { proxy_pass http://api; }

    location /docs/ {
        alias /var/www/docs/;
        try_files $uri $uri/ =404;
    }

    location /veratreeos/ {
        proxy_pass http://astro-veratreeos;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://astro-nifty;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
