upstream astro-nifty {
    server astro-nifty:4321;
    keepalive 16;
}

upstream astro-veratreeos {
    server astro-veratreeos:4322;
    keepalive 16;
}

# Redirect HTTP → HTTPS, except for ACME challenges
server {
    listen 80;
    server_name niftyedtools.com www.niftyedtools.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name niftyedtools.com www.niftyedtools.com;

    ssl_certificate     /etc/letsencrypt/live/niftyedtools.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/niftyedtools.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Re-resolve upstream hostnames dynamically using Docker's internal DNS
    resolver 127.0.0.11 valid=10s;

    # Astro static MPA: append trailing slash to extensionless paths so Vite
    # preview serves the correct per-page index.html instead of 404ing.
    rewrite ^(/[^./?#]+)$ $1/ redirect;

    # ── FastAPI endpoints ─────────────────────────────────────────
    location /api/ {
        set $api_upstream http://api:8000;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /healthz {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
    }
    location /readyz {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
    }

    location /docs/ {
        alias /var/www/docs/;
        try_files $uri $uri/ =404;
    }

    location /veratreeos/ {
        proxy_pass http://astro-veratreeos;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://astro-nifty;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 /deploying.html;
    }

    location = /deploying.html {
        root /var/www/deploying;
        internal;
    }
}

# ── databyjane.com ────────────────────────────────────────────────
# HTTP only for now: serves ACME challenges so certbot can issue the first
# certificate, and serves the site over plain HTTP until that cert exists.
# A 443 block can't be added before the cert is on disk: nginx refuses to start
# when ssl_certificate is missing, which would take niftyedtools.com down too.
# One-time, on the server after this deploys:
#   ENVIRONMENT=prod bash _root/_platform/up.sh run --rm --entrypoint certbot certbot certonly \
#     --webroot -w /var/www/certbot -d databyjane.com -d www.databyjane.com
# Then switch this block to an HTTPS redirect and add the 443 block.
# The upstream is resolved per request (not an upstream{} block), so nginx
# still starts if the astro-databyjane container isn't up yet.
server {
    listen 80;
    server_name databyjane.com www.databyjane.com;

    resolver 127.0.0.11 valid=10s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    rewrite ^(/[^./?#]+)$ $1/ redirect;

    location / {
        set $databyjane_upstream http://astro-databyjane:4323;
        proxy_pass $databyjane_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }
}
