services:
  astro-nifty:
    build:
      context: ../../../marketing/niftyedtools.com/_platform/_astro
      dockerfile: Dockerfile
    volumes:
      - ../../../marketing/niftyedtools.com/_platform/_astro:/app
      - nifty_astro_modules:/app/node_modules
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4321:4321"

  nginx:
    depends_on:
      astro-nifty:
        condition: service_started
    volumes:
      - ../../../marketing/niftyedtools.com/_platform/_nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  nifty_astro_modules:
