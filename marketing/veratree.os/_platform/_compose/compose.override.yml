services:
  astro-veratreeos:
    build:
      context: ../../../marketing/veratree.os/_platform/_astro
      dockerfile: Dockerfile
    volumes:
      - ../../../marketing/veratree.os/_platform/_astro:/app
      - veratreeos_astro_modules:/app/node_modules
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4322:4322"

volumes:
  veratreeos_astro_modules:
