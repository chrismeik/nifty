name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_BROKER_URL: ${{ secrets.REDIS_BROKER_URL }}
          REDIS_CACHE_URL: ${{ secrets.REDIS_CACHE_URL }}
          ENABLE_WORKER_METRICS: ${{ secrets.ENABLE_WORKER_METRICS }}
          WORKER_METRICS_PORT: ${{ secrets.WORKER_METRICS_PORT }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,DATABASE_URL,REDIS_URL,REDIS_BROKER_URL,REDIS_CACHE_URL,ENABLE_WORKER_METRICS,WORKER_METRICS_PORT,NEO4J_URI,NEO4J_USER,NEO4J_PASSWORD,ANTHROPIC_API_KEY,OPENAI_API_KEY,AWS_ACCOUNT_ID,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,EC2_HOST
          timeout: 20m
          script: |
            set -euo pipefail
            # Pull latest code first so the _root/_platform/_compose folder exists
            cd ~/veratree/root
            git pull origin main

            ENV_FILE=~/veratree/root/_root/_platform/_compose/.env

            # Write .env from secrets passed as env vars
            printf "UID=1000\n" > "$ENV_FILE"
            printf "GID=1000\n" >> "$ENV_FILE"
            printf "POSTGRES_USER=%s\n" "$POSTGRES_USER" >> "$ENV_FILE"
            printf "POSTGRES_PASSWORD=%s\n" "$POSTGRES_PASSWORD" >> "$ENV_FILE"
            printf "POSTGRES_DB=%s\n" "$POSTGRES_DB" >> "$ENV_FILE"
            printf "DATABASE_URL=%s\n" "$DATABASE_URL" >> "$ENV_FILE"
            printf "REDIS_URL=%s\n" "$REDIS_URL" >> "$ENV_FILE"
            printf "REDIS_BROKER_URL=%s\n" "$REDIS_BROKER_URL" >> "$ENV_FILE"
            printf "REDIS_CACHE_URL=%s\n" "$REDIS_CACHE_URL" >> "$ENV_FILE"
            printf "LOG_LEVEL=INFO\n" >> "$ENV_FILE"
            printf "ENABLE_WORKER_METRICS=%s\n" "$ENABLE_WORKER_METRICS" >> "$ENV_FILE"
            printf "WORKER_METRICS_PORT=%s\n" "$WORKER_METRICS_PORT" >> "$ENV_FILE"
            printf "NEO4J_URI=%s\n" "$NEO4J_URI" >> "$ENV_FILE"
            printf "NEO4J_USER=%s\n" "$NEO4J_USER" >> "$ENV_FILE"
            printf "NEO4J_PASSWORD=%s\n" "$NEO4J_PASSWORD" >> "$ENV_FILE"
            printf "ANTHROPIC_API_KEY=%s\n" "$ANTHROPIC_API_KEY" >> "$ENV_FILE"
            printf "OPENAI_API_KEY=%s\n" "$OPENAI_API_KEY" >> "$ENV_FILE"
            printf "AWS_ACCOUNT_ID=%s\n" "$AWS_ACCOUNT_ID" >> "$ENV_FILE"
            printf "AWS_ACCESS_KEY_ID=%s\n" "$AWS_ACCESS_KEY_ID" >> "$ENV_FILE"
            printf "AWS_SECRET_ACCESS_KEY=%s\n" "$AWS_SECRET_ACCESS_KEY" >> "$ENV_FILE"
            printf "AWS_REGION=us-east-1\n" >> "$ENV_FILE"
            printf "S3_COPY_ENABLED=false\n" >> "$ENV_FILE"
            printf "S3_COPY_BUCKET=veratree-nifty-prod\n" >> "$ENV_FILE"
            printf "S3_COPY_PREFIX=\n" >> "$ENV_FILE"
            printf "VERATREE_SERVER_IP=%s\n" "$EC2_HOST" >> "$ENV_FILE"

            # Deploy (prod lane: up.sh picks up compose.prod.yml / nginx.prod.conf)
            export ENVIRONMENT=prod
            bash _root/_platform/up.sh up -d --build 2>&1 | tail -20
            bash _root/_platform/up.sh exec nginx nginx -s reload
