name: root

services:

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"

  api:
    image: fastapi-api
    build:
      context: ../../_app
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ../../_app:/_app
      - ../../../:/root-product
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_BROKER_URL=${REDIS_BROKER_URL}
      - REDIS_CACHE_URL=${REDIS_CACHE_URL}
      - LOG_LEVEL=${LOG_LEVEL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}
      - AWS_REGION=${AWS_REGION}
      - S3_COPY_ENABLED=${S3_COPY_ENABLED:-false}
      - S3_COPY_BUCKET=${S3_COPY_BUCKET:-}
      - S3_COPY_PREFIX=${S3_COPY_PREFIX:-}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - PYTHONPATH=/:/root-product
      - ASTRO_URL=http://localhost
      - ENVIRONMENT=${ENVIRONMENT:-sandbox}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8000:8000"

  worker:
    image: fastapi-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../_app:/_app
      - ../../../:/root-product
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_BROKER_URL=${REDIS_BROKER_URL}
      - REDIS_CACHE_URL=${REDIS_CACHE_URL}
      - ENABLE_WORKER_METRICS=${ENABLE_WORKER_METRICS}
      - WORKER_METRICS_PORT=${WORKER_METRICS_PORT}
      - DB_NULLPOOL=1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_COPY_ENABLED=${S3_COPY_ENABLED:-false}
      - S3_COPY_BUCKET=${S3_COPY_BUCKET:-}
      - S3_COPY_PREFIX=${S3_COPY_PREFIX:-}
      - PYTHONPATH=/:/root-product
      - ENVIRONMENT=${ENVIRONMENT:-sandbox}
    command: dramatiq _app._dramatiq.tasks _app._dramatiq.task_registry --processes 1 --threads 4
    ports:
      - "8001:8001"

  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    profiles: ["observability"]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.0.0
    restart: unless-stopped
    profiles: ["observability"]
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/log:/var/log
      - promtail_data:/promtail
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      - prometheus
      - loki
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ${NGINX_CONF:-../_nginx/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"


volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  loki_data:
  promtail_data:
  prometheus_data:
  grafana_data: