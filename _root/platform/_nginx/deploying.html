<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Updating…</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f2462; color: white;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; text-align: center;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 1.25rem; }
  .spinner {
    width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #f97316; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 1.25rem; font-weight: 700; }
  p { font-size: 0.875rem; color: rgba(255,255,255,0.55); }
</style>
</head>
<body>
<div class="wrap">
  <div class="spinner"></div>
  <h1>Updating Nifty…</h1>
  <p>We'll be right back. This page will reload automatically.</p>
</div>
<script>
  function check() {
    fetch(window.location.href, { method: 'HEAD', cache: 'no-store' })
      .then(r => { if (r.ok) window.location.reload(); })
      .catch(() => {});
  }
  setInterval(check, 3000);
</script>
</body>
</html>
